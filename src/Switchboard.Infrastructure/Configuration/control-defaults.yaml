# Control-parameter defaults shipped with Switchboard (docs/04-ALGORITHMS.md §1 and §7).
# Starting values carried over from the Node-RED predecessor, not truths. The `control:` key of
# switchboard.yaml overrides any of them, key by key, with exactly this structure; a key that is
# not listed here is an error. The one exception is `limits:` (the safety envelope at the end),
# which no override can change. Durations: <n>ms, <n>s, <n>m or <n>h.

connection:
  # Reserve per phase for loads Switchboard does not control, when connection.reserve_w omits a phase.
  default_reserve_w: 2500

breaker:
  # I/In below which a breaker carries current indefinitely (IEC 60898 conventional non-tripping
  # current 1.13 × In). An unknown characteristic gets no credit for the curve.
  continuous_multiple:
    B: 1.13
    C: 1.13
    unknown: 1.00
  # Bands of I/In: each covers currents up to and including up_to; the last is open (up_to: null).
  # B and C share the thermal region (both trip conventionally between 1.13 and 1.45 × In; C
  # differs only in its magnetic trip, far above this table).
  tiers:
    B:
      - { up_to: 0.90, allowed: unlimited, reaction: may_add }
      - { up_to: 1.00, allowed: unlimited, reaction: hold }
      - { up_to: 1.13, allowed: 15m, reaction: reduce_ordinary_cycle }
      - { up_to: 1.25, allowed: 3m, reaction: reduce_next_cycle }
      - { up_to: 1.45, allowed: 30s, reaction: shed_one_immediately }
      - { up_to: null, allowed: 0s, reaction: shed_all_on_phase }
    C:
      - { up_to: 0.90, allowed: unlimited, reaction: may_add }
      - { up_to: 1.00, allowed: unlimited, reaction: hold }
      - { up_to: 1.13, allowed: 15m, reaction: reduce_ordinary_cycle }
      - { up_to: 1.25, allowed: 3m, reaction: reduce_next_cycle }
      - { up_to: 1.45, allowed: 30s, reaction: shed_one_immediately }
      - { up_to: null, allowed: 0s, reaction: shed_all_on_phase }
    unknown:
      - { up_to: 0.90, allowed: unlimited, reaction: may_add }
      - { up_to: 1.00, allowed: unlimited, reaction: hold }
      - { up_to: 1.13, allowed: 15m, reaction: reduce_ordinary_cycle }
      - { up_to: 1.25, allowed: 3m, reaction: reduce_next_cycle }
      - { up_to: 1.45, allowed: 30s, reaction: shed_one_immediately }
      - { up_to: null, allowed: 0s, reaction: shed_all_on_phase }

budget:
  # Overload budget with thermal memory (fraction of 1).
  recovery_time: 600s
  stop_increases_below: 0.50
  shed_one_below: 0.25
  top_tier_at_or_below: 0.00

dispatch:
  cycle: 30s
  start_hysteresis_w: 300
  stop_hysteresis_w: -200
  relay_min_on: 6m
  relay_min_off: 90s
  max_step_change_stages: 1
  phase_ranking_stability_cycles: 3
  balance_credit_kwh: 0.25
  persistence_up_cycles: 6
  persistence_down_cycles: 2
  max_simultaneous_increases: 1

settling:
  # A window opened by a command closes once every balance signal the command can move has
  # reported after command time + the device's reaction time, or at hard_timeout regardless.
  hard_timeout: 90s
  # A measured change is a match within the larger of this fraction of the expected change and
  # verification_sigma_multiplier standard deviations of the measurement noise.
  verification_tolerance: 0.5
  verification_sigma_multiplier: 3
  # This many consecutive mismatches mark a device unresponsive; it is excluded from dispatch and
  # gets one probe increase after unresponsive_retry_after (at least hard_timeout).
  mismatch_limit: 3
  unresponsive_retry_after: 30m

foreign_load:
  # Per phase: foreign load = house load minus our own devices, as a slow baseline (exponential
  # moving average with this time constant) plus a fast residual. A residual above
  # step_threshold_w is one foreign load event; the detector re-arms below rearm_fraction of it.
  baseline_time_constant: 10m
  step_threshold_w: 1000
  rearm_fraction: 0.5

circuit_groups:
  # Reserve per phase of a circuit group when its reserve_w omits the phase.
  default_reserve_w: 0

signals:
  # Measurement noise per kind when a signal declares no sigma (A, W, V).
  default_sigma:
    current: 0.1
    power: 25
    voltage: 1
  direction:
    # Direction power within ±deadband_w counts as import.
    deadband_w: 20
    # The direction power may be reported at most this much earlier than the value it signs.
    max_skew: 5s
    # A changed value waits this long for its direction power from the same meter poll.
    pairing_wait: 2s
    # A direction power factor (role phase_power_factor) within ±this many percent counts as import.
    power_factor_deadband_pct: 20
    # A negative power factor counts as export only after it has stayed negative this long; until then the phase counts as import.
    export_hold: 30s
  refresh:
    window_intervals: 64
    min_intervals: 8
    # A repeated value produces no event and doubles an interval, so a low quantile, not the median.
    quantile: 0.25
  freshness_probe:
    # A signal silent for this fraction of its max_age gets its last_reported confirmed.
    after_fraction: 0.5
  balance:
    # generation + import − loads below −residual_threshold_w (an impossible negative load) rejects the sample.
    residual_threshold_w: 300
    max_skew: 5s
  # The longest max_age a signal may declare: a frozen sensor counts as fresh for its whole max_age,
  # so a longer value (90h typed for 90s) is refused. At most 1193h, the platform's longest timer.
  max_age_limit: 24h
  # Polls by which a meter's current may lag its own power (the reference SolarEdge M1 does in
  # ~0.4 % of polls): each counts one more refresh of blind time in the reserve derivation.
  current_lag_polls: 1

reserve_derivation:
  # Minimum safe reserve per phase (SIG-07); see MinimumSafeReserve for the formula.
  reference_step_w: 2000
  shed_latency: 15s
  sigma_multiplier: 3
  floor_w: 0

devices:
  # Freshness of a device's applied-state signal when the device declares no state_max_age (SIG-05).
  state_max_age: 10m
  # From a command to the load actually changing, per device type; on a tie of value per kWh the
  # faster device sheds first.
  reaction_time:
    onoff: 1s
    stepped: 1s
    modulating: 20s
    storage: 20s
  # Freshness of a device's draw signals (draw:) when the draw declares no max_age.
  draw_max_age: 90s
  # Lockouts of modulating and storage devices when the device declares none; relays use
  # dispatch.relay_min_on and dispatch.relay_min_off.
  lockout:
    modulating:
      min_on: 60s
      min_off: 60s
  # What dispatch may do with a device that declares no start: (restore_only | headroom).
  # restore_only: never start or raise a device beyond the level it had before Switchboard reduced
  # it; only restore what protection or dispatch shed. headroom: start and raise within headroom
  # and rank (the behaviour before 0.7.0). Maintainer survey 2026-10-25.
  default_start: restore_only

effector:
  # After Home Assistant acknowledged a command, the device's reported state may take its reaction
  # time plus this long to show it; otherwise the device is flagged unconfirmed and one mismatch
  # counts (a Modbus relay or charger whose link is down may acknowledge and not switch). A new
  # starting value with no origin in 04 (DECISIONS 2026-10-25).
  confirm_timeout: 30s

hourly_balance:
  # The utility nets energy per local hour (docs/13-HOURLY-BALANCE.md). Dispatch asks whether energy is
  # wanted from the balance projected to the next :00, against a band: floor_wh is flat, the ceiling
  # collapses to it over the last burn_window (the burn-down of the surplus). Starting values carried
  # over from the Node-RED predecessor, not truths.
  floor_wh: 150
  ceiling_wh: 525
  burn_window: 15m
  # Free power (grid net export + own loads added back) is the mean of this window; tune in shadow.
  smoothing_window: 5m
  # Time to the :00 is floored at this when projecting. A new starting value with no origin in the
  # predecessor (DECISIONS 2026-10-26).
  min_remaining: 1m
  # The longest gap between two free-power samples the smoothing window bridges; a longer silence
  # starts the window afresh. A new starting value with no origin in the predecessor.
  max_age: 60s

economics:
  # Parameters of the economic module (docs/14-ECONOMICS.md), read by dispatch. Every one is a starting value, no origin.
  # Price units per kWh by which a device's value must exceed the cost of the energy; starting value, no origin.
  min_margin: 0
  # Boundaries a new value order must be proposed before it is adopted (as dispatch.phase_ranking_stability_cycles); starting value, no origin.
  order_stability_cycles: 3
  # Relative key difference below which two devices keep their order; starting value, no origin.
  order_min_gap_fraction: 0.05
  # No zone-class start this close to the end of a tariff zone (equals relay_min_on); starting value, no origin.
  zone_end_margin: 6m
  # Smoothing window of the instantaneous surplus under net billing; starting value, no origin.
  net_billing_window: 60s

planner:
  # Parameters of the planner (docs/15-PLANNER.md). Bound and checked, read by nothing before the planner exists. Every one is a
  # starting value, none has an origin unless it says so; review after the shadow week.
  # Replanning period, aligned to :00 :15 :30 :45.
  cycle: 15m
  # At most one triggered replan per this interval.
  min_replan_interval: 60s
  # After this a plan is not used by dispatch (three cycles).
  plan_max_age: 45m
  max_solve_time: 2s
  # No plan before the inputs had this long to arrive after a start.
  start_delay: 60s
  horizon: 48h
  # 15m, 30m or 60m.
  slot: 60m
  # Factor on the PV forecast; the mockup says the price difference "covers the risk of worse weather".
  pv_derate: 0.85
  # How a daily PV total is spread over daylight: half_sine.
  pv_shape: half_sine
  refine_passes: 3
  adopt_cycles: 2
  adopt_min_change_fraction: 0.05
  progress_tolerance_fraction: 0.10
  hard_goal:
    # A hard goal turns urgent this long before its latest grid start.
    escalation_margin: 30m
  load:
    halflife_days: 14
    min_observed_fraction: 0.8
    # The house load with no profile at all (W).
    fallback_w: 400
  storage:
    soc_step_kwh: 0.1
    # Price units per kWh by which a charge and discharge pair must earn.
    min_spread: 0.10
    degradation_per_kwh: 0
    terminal_value: 0
  goal:
    # max_age of a goal input entity (soc, target, deadline, want) that declares none; a helper entity reports rarely, so it is long.
    input_max_age: 1h
    # loss_fraction of a goal that declares none: energy drawn = needed x (1 + loss_fraction).
    default_loss_fraction: 0

ev:
  # Parameters of the EV module (docs/EV.md, docs/12-EV-MODULE.md). Bound and checked, read by nothing before the module exists. Every one is a
  # starting value with no origin unless it says so; review after the shadow week. SoC values are percent of capacity.
  # SoC held from the cheapest zone when no trip is planned.
  floor: 25
  # SoC that must remain after a trip.
  floor_after: 25
  # Percentage points on top of trip SoC and floor_after (target = trip SoC + floor_after + reserve).
  reserve: 15
  # Ceiling of surplus-only charging.
  cap: 90
  weekly_full:
    # Local weekdays on which one full charge a week is allowed (the maintainer's weekend).
    days: [saturday, sunday]
    target: 100
  # The car is ready this long before a trip starts.
  ready_margin: 30m
  # Charging losses: energy drawn = energy stored x (1 + loss).
  loss: 0.10
  # kWh per km while nothing is learned: the maintainer's full charge, 18 kWh, is about 90 km.
  kwh_per_km: 0.20
  learn:
    # Weight of a new sample in the smoothed kWh/km.
    smoothing: 0.2
    # A SoC and range pair below this SoC is not used (the buffer at the bottom is not representative).
    min_soc: 20
    # Plausibility bounds of one sample (kWh per km).
    min_kwh_per_km: 0.12
    max_kwh_per_km: 0.60
    # Samples kept in the state file (at most 200, what ev.json holds).
    max_samples: 50
    # A SoC and a range count as one report when their report times differ by at most this. Starting value with no origin: Home Assistant stamps
    # the two entities of one car update a moment apart; review after the shadow week.
    pair_tolerance: 60s
  # A trip longer than this is a typo and is ignored (km).
  max_trip_km: 500
  # Beyond this the SoC estimate is not trusted and the goals are inactive.
  soc_max_age: 6h
  # Energy that may flow into the car unseen by the SoC (air conditioning) before the estimate is dropped.
  drift_limit_kwh: 1.5
  # A frozen trip target is recomputed only when it moves by more than this many percentage points.
  target_change_threshold: 3
  charge_now:
    # SoC "charge now" runs to when the request names none.
    target: 90
    # A "charge now" that has not reached its target ends after this long.
    duration: 12h
  # Spread a charge evenly over a long window instead of running at the ceiling.
  spread: true
  # The module's offer is computed beside the control loop; one older than this is dropped. Starting value with no origin (a few dispatch cycles).
  snapshot_max_age: 2m

decision_log:
  # Daily decision files (/data/decisions/YYYY-MM-DD.jsonl, UTC days) are kept this many days.
  retention_days: 30

# Safety envelope of the tier tables (IEC 60898 thermal points). Read from this file only:
# `control.limits` is refused, and a `control.breaker` override that leaves the envelope is an error.
#  - the last band is shed_all_on_phase with allowed 0s, and starts at or below open_band_from_max;
#  - a band reaching above the continuous multiple has a finite duration and is neither may_add nor hold;
#  - a may_add band ends at or below may_add_up_to_max;
#  - B and C claim at most continuous_multiple_max, unknown at most unknown_continuous_multiple_max;
#  - budget.recovery_time is at least budget_recovery_time_min: a faster recovery would let short
#    dips under the continuous current erase the thermal memory of repeated excursions (BRK-02);
#  - budget.stop_increases_below and budget.shed_one_below are at least their _min: a lower
#    threshold reacts later to the same loss of budget.
limits:
  continuous_multiple_max: 1.13
  unknown_continuous_multiple_max: 1.00
  may_add_up_to_max: 1.00
  open_band_from_max: 1.45
  budget_recovery_time_min: 600s
  budget_stop_increases_below_min: 0.50
  budget_shed_one_below_min: 0.25

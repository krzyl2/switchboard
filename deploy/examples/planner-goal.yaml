# The planner section and a device goal (docs/15-PLANNER.md, 0.11 slice 1). Both are read, validated and shown (GET api/plan); nothing here
# changes a decision yet: the plan reaches dispatch only in a later release, behind planner.dispatch.
#
# Append the section below to switchboard.yaml. `dispatch: off` is the default and the only value that does anything today: the plan is shown,
# dispatch ignores it. `narrow` and `full` are accepted and echoed.
planner:
  dispatch: off

# A goal belongs to the device that wants the energy: add it under that device in devices:, for example under ev_charger. Every input is a
# literal or an entity; an entity becomes a signal of the device (so it is checked for freshness and units like a measurement), and a
# missing, stale or out-of-range input makes the goal inactive with the reason, never guessed.
#
#   goal:
#     kind: soc                  # soc: reach a percentage of capacity_kwh. energy: draw target_kwh (counted from the device's own energy)
#     hard: true                 # a hard deadline must be met; soft (the default) only while it is worth its price
#     capacity_kwh: 18           # soc only
#     loss_fraction: 0.10        # energy drawn = needed x (1 + loss_fraction)
#     soc:      { entity: sensor.car_battery_level, max_age: 30m }
#     target:   { value: 90 }    # percent; or { entity: input_number.car_target_soc, max_age: 1h }
#     deadline: { entity: input_datetime.car_departure, margin: 30m }   # or { at: "06:30" }, a recurring local time
#     want:     { entity: input_boolean.car_charge_wanted }             # optional gate; off means no goal now
#     sources: pv_and_zone:offpeak
#     on_met: opportunistic
#
# An energy goal needs no sensor of its own:
#
#   goal:
#     kind: energy
#     target_kwh: 12
#     deadline: { at: "06:30" }
#
# PV forecast from the core forecast_solar sensors and the sun entity only (no hourly series in Home Assistant). Add these under signals:. The day
# totals are spread over daylight between the sun's next rising and next setting (basis `totals` in GET api/plan); a stale total or sun means zero
# PV for the plan, never the last known value. `sun.sun` feeds both sun signals, each through its own attribute. Check the entity names in your HA.
#
# Hourly PV series instead (better than the totals; when it is usable it wins over them). A template sensor in HA sums the watts dictionaries
# of the Forecast.Solar planes by time key into the attribute `watts` (a dict, local time of the site without an offset, "2026-10-29 07:00:00" -> W;
# the keys need not be sorted). The add-on reads those times in its own zone, the one of the plan's slot grid, so the add-on and HA must have the
# same time zone. Values are instantaneous watts; the plan integrates them as straight lines between points. The source refreshes hourly: 3h.
#
#   pv_forecast_series:
#     entity: sensor.pv_forecast_watts
#     kind: series
#     attribute: watts
#     series: { shape: dict, value: power_w }
#     max_age: 3h
#     role: pv_forecast
#
# Or the daily totals shape:
#
#   pv_forecast_today:
#     entity: sensor.energy_production_today
#     kind: energy_forecast
#     unit: kWh
#     max_age: 3h             # the sensor refreshes hourly
#     role: pv_forecast_today
#   pv_forecast_tomorrow:
#     entity: sensor.energy_production_tomorrow
#     kind: energy_forecast
#     unit: kWh
#     max_age: 3h
#     role: pv_forecast_tomorrow
#   sun_rising:
#     entity: sun.sun
#     kind: timestamp
#     attribute: next_rising  # sun.sun's state is above_horizon / below_horizon; the instant is in the attribute
#     max_age: 1h
#     role: sun_rising
#   sun_setting:
#     entity: sun.sun
#     kind: timestamp
#     attribute: next_setting
#     max_age: 1h
#     role: sun_setting

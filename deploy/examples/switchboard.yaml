# Switchboard configuration (signals, devices and dispatch; display names from 0.5.0): the maintainer's installation.
# 3 × 25 A, characteristic B (assumed), 230 V, PV on a SolarEdge inverter with an M1 meter.
#
# Copy to /addon_configs/<id>_switchboard/switchboard.yaml on the Home Assistant host (the add-on
# sees it as /config/switchboard.yaml). Changes are picked up within seconds, without a restart.
#
# Only primary measurements: never a template or derived sensor (sensor.usage and friends compute
# a difference of two sources sampled out of step and dip periodically; see docs/07-PITFALLS.md).

schema_version: 1

connection:
  topology: three_phase
  breaker_rating_a: 25
  characteristic: B          # assumed; confirm on the main breaker's label
  voltage_v: 230
  reserve_w: { L1: 2500, L2: 2500, L3: 2500 }

signals:
  # Main meter (SolarEdge M1, polled with the inverter). Meter phases A/B/C are assumed to be
  # L1/L2/L3: UNVERIFIED. Switch one heater element on at a time and check that only its phase rises.

  # Per-phase active power: signed, positive = export (negative = import).
  grid_power_l1:
    entity: sensor.solaredge_m1_ac_power_a
    kind: power
    unit: W
    sign: positive_export
    max_age: 90s
    role: phase_power
    phase: L1
  grid_power_l2:
    entity: sensor.solaredge_m1_ac_power_b
    kind: power
    unit: W
    sign: positive_export
    max_age: 90s
    role: phase_power
    phase: L2
  grid_power_l3:
    entity: sensor.solaredge_m1_ac_power_c
    kind: power
    unit: W
    sign: positive_export
    max_age: 90s
    role: phase_power
    phase: L3

  # Per-phase current: unsigned (positive for import and export), so the direction comes from the
  # power of the same phase. Protection reads these.
  grid_current_l1:
    entity: sensor.solaredge_m1_ac_current_a
    kind: current
    unit: A
    sign: unsigned
    direction_from: grid_power_l1
    sigma: 0.1
    max_age: 90s
    role: phase_current
    phase: L1
  grid_current_l2:
    entity: sensor.solaredge_m1_ac_current_b
    kind: current
    unit: A
    sign: unsigned
    direction_from: grid_power_l2
    sigma: 0.1
    max_age: 90s
    role: phase_current
    phase: L2
  grid_current_l3:
    entity: sensor.solaredge_m1_ac_current_c
    kind: current
    unit: A
    sign: unsigned
    direction_from: grid_power_l3
    sigma: 0.1
    max_age: 90s
    role: phase_current
    phase: L3

  grid_voltage_l1:
    entity: sensor.solaredge_m1_ac_voltage_an
    kind: voltage
    unit: V
    max_age: 90s
    role: phase_voltage
    phase: L1
  grid_voltage_l2:
    entity: sensor.solaredge_m1_ac_voltage_bn
    kind: voltage
    unit: V
    max_age: 90s
    role: phase_voltage
    phase: L2
  grid_voltage_l3:
    entity: sensor.solaredge_m1_ac_voltage_cn
    kind: voltage
    unit: V
    max_age: 90s
    role: phase_voltage
    phase: L3

  # Inverter: production flows into the house busbar, so positive_import. Asleep at night it reports
  # 0 W at dusk and then nothing until morning (live 0.4.0; it may also go unavailable);
  # unavailable_as_zero counts either as 0 W instead of unknown. Silence after a production stays unknown.
  pv_power:
    entity: sensor.solaredge_ac_power
    kind: power
    unit: W
    sign: positive_import
    max_age: 90s
    role: inverter_power
    unavailable_as_zero: true

  # Inverter output current per phase: splits the production across the phases.
  pv_current_l1:
    entity: sensor.solaredge_ac_current_a
    kind: current
    unit: A
    sign: unsigned
    direction_from: pv_power
    max_age: 90s
    role: inverter_phase_current
    phase: L1
  pv_current_l2:
    entity: sensor.solaredge_ac_current_b
    kind: current
    unit: A
    sign: unsigned
    direction_from: pv_power
    max_age: 90s
    role: inverter_phase_current
    phase: L2
  pv_current_l3:
    entity: sensor.solaredge_ac_current_c
    kind: current
    unit: A
    sign: unsigned
    direction_from: pv_power
    max_age: 90s
    role: inverter_phase_current
    phase: L3

# Devices the guard may reduce or shed and dispatch may start. Each actuator is the only entity that
# may ever be commanded for that device; this version commands nothing (shadow mode, no command
# path): it computes and logs what it would do, and what it would have each device at.
#
# Assumption: the house prefers charging the car, so the heater elements (lower value per kWh)
# shed before the charger and are started after it.
#
# PHASES FOLLOW THE METER (changed in 0.4.0, to be confirmed by the maintainer before it goes live):
# a device must be declared on the phase whose grid_current_lN it loads. In the 72 h recording
# (2026-10-21 to 2026-10-24), every isolated relay switching moved one meter phase only:
#   switch.grzalka_1 moves meter phase B (grid_*_l2): 10-23 07:39 off +1682 W, 07:45 on -1709 W,
#     07:59 on -1699 W, 09:06 on -1658 W, 10:20 on -1730 W, 11:00 off +1703 W, 11:06 on -1662 W,
#     11:27 off +1668 W;
#   switch.grzalka_2 moves meter phase A (grid_*_l1), the phase the charger is on: 10-23 08:47 on
#     -1614 W, 08:54 off +1649 W, 10:44 on -1695 W;
#   switch.grzalka_3 has no isolated switching in the recording; L3 by elimination (unverified).
# So heater_l1 is switch.grzalka_2 and heater_l2 is switch.grzalka_1 (in 0.3.x the other way round,
# which made an L1 overload shed an element that draws nothing on L1). Whether meter phase A is
# really L1 in the switchboard is a separate question (CONN-05); the meter's frame is what counts.
#
# Ratings: clean steps of 1634-1711 W at 244-249 V in the recording, about 6.9 A; declared as
# 7.0 A / 1700 W (rated current rounded up). The model is the same for all three elements (assumed
# for switch.grzalka_3, which has no clean step).
#
# The heater relays are Modbus switches that Home Assistant reports only when they change, so their
# state can be hours old while still true: state_reports: on_change takes their freshness from
# availability (unavailable, unknown, a missing entity or a lost connection still make the state
# unknown) instead of an age limit. The elements have no power measurement of their own
# (sensor.moc_grzalek_cwu is a template sensor and must never be an input): a running element is
# counted at its rating, and an element whose thermostat has opened draws nothing although it is on.
#
# The three elements are identical and sit one per phase, so which one runs is free:
# rotation_group lets dispatch start the element on the phase with the most headroom first.
#
# name: is shown in the UI next to the id (0.5.0 and later; 0.4.x refuses the key, so deploy this
# file only once 0.5.0 is installed). It never takes part in a decision.
devices:
  - id: heater_l1
    name: Grzałka CWU L1
    type: onoff
    actuator: switch.grzalka_2      # moves meter phase A (see above)
    phase: L1
    rated_current_a: 7.0
    rated_power_w: 1700
    value_per_kwh: 0.35
    state_reports: on_change
    rotation_group: cwu_heaters
  - id: heater_l2
    name: Grzałka CWU L2
    type: onoff
    actuator: switch.grzalka_1      # moves meter phase B (see above)
    phase: L2
    rated_current_a: 7.0
    rated_power_w: 1700
    value_per_kwh: 0.35
    state_reports: on_change
    rotation_group: cwu_heaters
  - id: heater_l3
    name: Grzałka CWU L3
    type: onoff
    actuator: switch.grzalka_3      # L3 by elimination: no isolated switching recorded
    phase: L3
    rated_current_a: 7.0
    rated_power_w: 1700
    value_per_kwh: 0.35
    state_reports: on_change
    rotation_group: cwu_heaters
  # go-e charger forced to one phase (meter phase A, like switch.grzalka_2: every step of nrg_4 in
  # the recording moved meter phase A); the actuator sets the charging current (6-20 A, 1 A steps).
  # A setpoint is a ceiling, not a draw: the car takes less, or nothing. What the charger really
  # draws comes from its own sensors, refreshed every 1-3 s: nrg_4 is the current on its L1 in A
  # (0-19.2 A in the recording), nrg_7 the power on its L1 in W (up to 4.49 kW; a few W negative
  # at rest). The draw decides how much shedding the charger can give and is the only basis for
  # checking that it followed a change.
  # It has no stop actuator declared: the guard reduces it to 6 A at most and records any further
  # step as "would switch off". A go-e switch that stops charging could be declared as stop_actuator.
  # Live 0.4.0: the go-e entities report only on change, so at rest the setpoint and both draw
  # sensors are hours old. The setpoint is a device state: state_reports: on_change. The draw stays
  # judged by age: a draw silent after exactly 0 is an idle charger and counts as 0 W (0.5.1); a
  # draw silent at any other value is "not trusted" (no relief, no increases), because a frozen
  # old draw would claim relief the charger cannot give.
  - id: ev_charger
    name: Ładowarka go-e
    type: modulating
    actuator: number.goe_422752_amp
    phase: L1
    min: 6
    max: 20
    step: 1
    value_per_kwh: 2.03
    state_reports: on_change
    draw:
      current: sensor.goe_422752_nrg_4   # A, the charger's own L1 current
      power: sensor.goe_422752_nrg_7     # W, the charger's own L1 power, positive = consumption
      max_age: 60s

# circuit_groups: none here. A group of devices behind a downstream breaker with its own limit
# would be declared like this (and each member names it with circuit_group: carport):
# circuit_groups:
#   - id: carport
#     breaker_rating_a: 16
#     characteristic: B
#     phases: [L1]
#     current: { L1: sensor.carport_current_l1 }   # optional sub-meter in A; without one the
#     current_max_age: 90s                         # members' worst case is used

# control: overrides any control-parameter default, key by key, for example:
# control:
#   signals:
#     balance:
#       residual_threshold_w: 400

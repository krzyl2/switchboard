# Switchboard configuration, Stage 2 (signals and devices): the maintainer's installation.
# 3 × 25 A, characteristic B (assumed), 230 V, PV on a SolarEdge inverter with an M1 meter.
#
# Copy to /addon_configs/<id>_switchboard/switchboard.yaml on the Home Assistant host (the add-on
# sees it as /config/switchboard.yaml). Changes are picked up within seconds, without a restart.
#
# Only primary measurements: never a template or derived sensor (sensor.usage and friends compute
# a difference of two sources sampled out of step and dip periodically; see docs/07-PITFALLS.md).

schema_version: 1

connection:
  topology: three_phase
  breaker_rating_a: 25
  characteristic: B          # assumed; confirm on the main breaker's label
  voltage_v: 230
  reserve_w: { L1: 2500, L2: 2500, L3: 2500 }

signals:
  # Main meter (SolarEdge M1, polled with the inverter). Meter phases A/B/C are assumed to be
  # L1/L2/L3: UNVERIFIED. Switch one heater element on at a time and check that only its phase rises.

  # Per-phase active power: signed, positive = export (negative = import).
  grid_power_l1:
    entity: sensor.solaredge_m1_ac_power_a
    kind: power
    unit: W
    sign: positive_export
    max_age: 90s
    role: phase_power
    phase: L1
  grid_power_l2:
    entity: sensor.solaredge_m1_ac_power_b
    kind: power
    unit: W
    sign: positive_export
    max_age: 90s
    role: phase_power
    phase: L2
  grid_power_l3:
    entity: sensor.solaredge_m1_ac_power_c
    kind: power
    unit: W
    sign: positive_export
    max_age: 90s
    role: phase_power
    phase: L3

  # Per-phase current: unsigned (positive for import and export), so the direction comes from the
  # power of the same phase. Protection reads these.
  grid_current_l1:
    entity: sensor.solaredge_m1_ac_current_a
    kind: current
    unit: A
    sign: unsigned
    direction_from: grid_power_l1
    sigma: 0.1
    max_age: 90s
    role: phase_current
    phase: L1
  grid_current_l2:
    entity: sensor.solaredge_m1_ac_current_b
    kind: current
    unit: A
    sign: unsigned
    direction_from: grid_power_l2
    sigma: 0.1
    max_age: 90s
    role: phase_current
    phase: L2
  grid_current_l3:
    entity: sensor.solaredge_m1_ac_current_c
    kind: current
    unit: A
    sign: unsigned
    direction_from: grid_power_l3
    sigma: 0.1
    max_age: 90s
    role: phase_current
    phase: L3

  grid_voltage_l1:
    entity: sensor.solaredge_m1_ac_voltage_an
    kind: voltage
    unit: V
    max_age: 90s
    role: phase_voltage
    phase: L1
  grid_voltage_l2:
    entity: sensor.solaredge_m1_ac_voltage_bn
    kind: voltage
    unit: V
    max_age: 90s
    role: phase_voltage
    phase: L2
  grid_voltage_l3:
    entity: sensor.solaredge_m1_ac_voltage_cn
    kind: voltage
    unit: V
    max_age: 90s
    role: phase_voltage
    phase: L3

  # Inverter: production flows into the house busbar, so positive_import. It goes unavailable
  # every night (asleep); unavailable_as_zero counts that as 0 W instead of unknown.
  pv_power:
    entity: sensor.solaredge_ac_power
    kind: power
    unit: W
    sign: positive_import
    max_age: 90s
    role: inverter_power
    unavailable_as_zero: true

  # Inverter output current per phase: splits the production across the phases.
  pv_current_l1:
    entity: sensor.solaredge_ac_current_a
    kind: current
    unit: A
    sign: unsigned
    direction_from: pv_power
    max_age: 90s
    role: inverter_phase_current
    phase: L1
  pv_current_l2:
    entity: sensor.solaredge_ac_current_b
    kind: current
    unit: A
    sign: unsigned
    direction_from: pv_power
    max_age: 90s
    role: inverter_phase_current
    phase: L2
  pv_current_l3:
    entity: sensor.solaredge_ac_current_c
    kind: current
    unit: A
    sign: unsigned
    direction_from: pv_power
    max_age: 90s
    role: inverter_phase_current
    phase: L3

# Devices the guard may reduce or shed. Each actuator is the only entity that may ever be commanded
# for that device; this version commands nothing (shadow mode, no command path): it computes and
# logs what it would do. Each device's applied state is read from its actuator (state_entity
# overrides) and must be reported within state_max_age (default 10m), or the device is unsafe.
#
# Assumption: the house prefers charging the car, so the heater elements (lower value per kWh)
# shed before the charger.
#
# The heater relays are Modbus switches that Home Assistant reports only when they change, so their
# state can be hours old while still true; they get the longest state_max_age allowed (24h).
devices:
  - id: heater_l1
    type: onoff
    actuator: switch.grzalka_1
    phase: L1
    rated_current_a: 6.6        # 1.5 kW element at 230 V
    rated_power_w: 1500
    value_per_kwh: 0.35
    state_max_age: 24h
  - id: heater_l2
    type: onoff
    actuator: switch.grzalka_2
    phase: L2
    rated_current_a: 6.6
    rated_power_w: 1500
    value_per_kwh: 0.35
    state_max_age: 24h
  - id: heater_l3
    type: onoff
    actuator: switch.grzalka_3
    phase: L3
    rated_current_a: 6.6
    rated_power_w: 1500
    value_per_kwh: 0.35
    state_max_age: 24h
  # go-e charger forced to one phase; the actuator sets the charging current (6-20 A, 1 A steps).
  # It cannot be switched off before a stop actuator exists: the guard reduces it to 6 A and
  # records any further step as "would switch off".
  - id: ev_charger
    type: modulating
    actuator: number.goe_422752_amp
    phase: L1
    min: 6
    max: 20
    step: 1
    value_per_kwh: 2.03

# circuit_groups: arrive in a later version.

# control: overrides any control-parameter default, key by key, for example:
# control:
#   signals:
#     balance:
#       residual_threshold_w: 400
